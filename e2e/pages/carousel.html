<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carousel</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      .embla {
        overflow: hidden;
        max-width: 1000px;
      }
      .embla__container {
        display: flex;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .embla__slide {
        flex: 0 0 calc(100% / var(--per-view));
        min-width: 0;
        padding: 1rem;
        box-sizing: border-box;
        border: 1px solid #767676;
      }
      .embla__controls {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .embla__controls button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 1rem;
      }
      .embla__dots {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin-top: 0.5rem;
      }
      .embla__dot {
        width: 24px;
        height: 24px;
        border: 2px solid #595959;
        border-radius: 50%;
        background: #fff;
      }
      .embla__dot[aria-current='true'] {
        background: #595959;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .embla--vertical {
        height: 600px;
      }
      .embla--vertical .embla__container {
        flex-direction: column;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Carousel</h1>
      <p id="description"></p>
      <section class="carousel" aria-labelledby="carousel-heading">
        <h2 id="carousel-heading">Featured products</h2>
        <button type="button" class="embla__rotation" hidden>
          <span data-rotation-playing>Stop slide rotation</span>
          <span data-rotation-stopped hidden>Start slide rotation</span>
        </button>
        <div class="embla">
          <ul class="embla__container" role="list"></ul>
        </div>
        <div class="embla__controls">
          <button type="button" class="embla__prev">Previous</button>
          <button type="button" class="embla__next">Next</button>
        </div>
        <div
          class="embla__dots"
          data-dot-label="Go to slide {first}"
          data-dot-label-group="Go to slides {first} to {last}"
        ></div>
        <p
          class="embla__announcer visually-hidden"
          aria-live="polite"
          aria-atomic="true"
          data-announcement="Slide {first} of {total}"
          data-announcement-group="Slides {first} to {last} of {total}"
          data-announcement-wrapped="Slides {slides} of {total}"
        ></p>
        <p id="cart-status">Cart is empty</p>
      </section>
      <p><a href="index.html">All variants</a></p>
    </main>
    <script type="module" src="./carousel.ts"></script>
  </body>
</html>
